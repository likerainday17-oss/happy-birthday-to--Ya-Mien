<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅綿，生日快樂 🎂</title>
<style>
  @import url('https://googleapis.com');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 50%, #f8bbd0 100%);
    font-family: 'Noto Sans TC', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: #5d4037;
    padding: 20px;
  }

  /* 蛋糕區塊 */
  .cake-section {
    text-align: center;
    transition: all 0.8s ease;
    margin-bottom: 20px;
  }

  .title {
    font-family: 'Pacifico', cursive;
    font-size: 2.8rem;
    color: #e91e63;
    text-shadow: 2px 2px 8px rgba(233, 30, 99, 0.2);
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1.1rem;
    color: #8d6e63;
    margin-bottom: 50px;
  }

  /* CSS 繪製生日蛋糕 */
  .cake {
    position: relative;
    width: 220px;
    height: 160px;
    margin: 0 auto;
    cursor: pointer;
  }

  .plate {
    width: 260px;
    height: 15px;
    background: #ffffff;
    border-radius: 10px;
    position: absolute;
    bottom: -10px;
    left: -20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .layer-bottom {
    width: 220px;
    height: 65px;
    background: #f48fb1;
    border-radius: 15px 15px 5px 5px;
    position: absolute;
    bottom: 5px;
  }

  .layer-top {
    width: 170px;
    height: 55px;
    background: #f8bbd0;
    border-radius: 15px 15px 0 0;
    position: absolute;
    bottom: 70px;
    left: 25px;
  }

  .icing {
    width: 170px;
    height: 20px;
    background: #ffffff;
    border-radius: 15px 15px 10px 10px;
    position: absolute;
    bottom: 110px;
    left: 25px;
  }

  /* 蠟燭與火焰 */
  .candle {
    width: 14px;
    height: 45px;
    background: repeating-linear-gradient(
      45deg,
      #ffffff,
      #ffffff 5px,
      #ff80ab 5px,
      #ff80ab 10px
    );
    border-radius: 4px;
    position: absolute;
    bottom: 125px;
    left: 103px;
  }

  .flame {
    width: 16px;
    height: 26px;
    background: radial-gradient(ellipse at bottom, #fff59d 0%, #ffb300 60%, #ff6f00 100%);
    border-radius: 50% 50% 35% 35%;
    position: absolute;
    top: -28px;
    left: -1px;
    box-shadow: 0 0 15px #ffb300, 0 0 30px #ff8f00;
    animation: flicker 0.6s infinite alternate;
    transform-origin: center bottom;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .flame.out {
    opacity: 0;
    transform: scale(0);
  }

  @keyframes flicker {
    0% { transform: scale(1) rotate(-2deg); }
    100% { transform: scale(1.08) rotate(2deg); }
  }

  .hint-btn {
    margin-top: 35px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    background: #e91e63;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
    transition: transform 0.2s, background 0.3s;
  }

  .hint-btn:hover {
    background: #d81b60;
    transform: translateY(-2px);
  }

  /* 祝福卡片區塊 */
  .card {
    max-width: 520px;
    width: 100%;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 35px 30px;
    box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
    text-align: left;
    line-height: 1.8;
    opacity: 0;
    transform: translateY(30px);
    pointer-events: none;
    transition: all 0.9s ease;
    display: none;
  }

  .card.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .card h2 {
    color: #e91e63;
    margin-bottom: 16px;
    font-size: 1.5rem;
  }

  .card p {
    margin-bottom: 14px;
    font-size: 1.05rem;
  }

  .signature {
    text-align: right;
    font-weight: bold;
    color: #ad1457;
    margin-top: 20px;
    font-size: 1.1rem;
  }

  /* 飄落彩帶畫布 */
  #confetti {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="cake-section" id="cakeSection">
  <h1 class="title">Happy Birthday!</h1>
  <p class="subtitle">雅綿，在心裡許個願，然後點一下蠟燭吹熄它 ✨</p>

  <div class="cake" onclick="blowCandle()">
    <div class="plate"></div>
    <div class="layer-bottom"></div>
    <div class="layer-top"></div>
    <div class="icing"></div>
    <div class="candle">
      <div class="flame" id="flame"></div>
    </div>
  </div>

  <button class="hint-btn" id="blowBtn" onclick="blowCandle()">吹熄蠟燭 🎂</button>
</div>

<div class="card" id="wishCard">
  <h2>To 雅綿：</h2>
  <p>生日快樂！今天是屬於妳的日子，希望這個小小的網頁能帶給妳一點驚喜。</p>
  <p>認識妳之後，覺得生活多了很多開心的時刻。謝謝妳總是這麼溫柔、真誠，也希望新的一歲，妳所有的願望都能慢慢實現。</p>
  <p>願妳每天都能像今天一樣燦爛，永遠被溫柔與快樂包圍！</p>
  <div class="signature">—— 柏銘</div>
</div>

<script>
  let isBlown = false;

  function blowCandle() {
    if (isBlown) return;
    isBlown = true;

    // 熄滅火焰
    document.getElementById('flame').classList.add('out');
    document.getElementById('blowBtn').style.display = 'none';
    document.querySelector('.subtitle').textContent = '願望一定會實現的 🎉';

    // 啟動彩帶特效並顯示卡片
    startConfetti();
    setTimeout(() => {
      const card = document.getElementById('wishCard');
      card.classList.add('show');
      card.scrollIntoView({ behavior: 'smooth' });
    }, 600);
  }

  // 簡易彩帶動畫
  function startConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const pieces = [];
    const colors = ['#e91e63', '#ff80ab', '#ffd54f', '#4fc3f7', '#81c784'];

    for (let i = 0; i < 120; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: Math.random() * 10 + 6,
        h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: Math.random() * 3 + 2,
        angle: Math.random() * 360
      });
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.y += p.speed;
        p.angle += 2;
        if (p.y > canvas.height) p.y = -10;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      requestAnimationFrame(update);
    }
    update();
  }
</script>

</body>
</html>
